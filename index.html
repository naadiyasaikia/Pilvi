<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pilvi</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>

        <div class="card">
            <div class="search">
                <input type="text" placeholder="Search for a city..." spellcheck="false">
                <button><img src="images/search.png"></button>
            </div>
            <div class="self-loc">
                <button onclick="getLocation()" id="self-loc-btn">Or use your own location?</button>
                <p id="location"></p>
            </div>
            <div class="unit-selector">
                <label for="units">Temperature:</label>
                <select id="units">
                <option value="C">°C Celsius</option>
                <option value="F">°F Fahrenheit</option>
                <option value="K">K Kelvin</option>
                </select>
            </div>
            <div class="error">
                <p>Invalid city name.</p>
            </div>
            <div class="weather">
                <img src="images/rain.png" class="weather-icon">
                <h1 class="temp">20°C</h1>
                <h2 class="city">New York</h2>
                <div class="details">
                    <div class="col">
                        <img src="images/humidity.png">
                        <div>
                            <p class="humidity">50%</p>
                            <p>Humidity</p>
                        </div>
                    </div>
                    <div class="col">
                        <img src="images/wind.png">
                        <div>
                            <p class="wind">10 km/h</p>
                            <p>Wind Speed</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="forecast" style="display: none;">
                <h3>Next 24 Hours</h3>
                <div class="hourly-forecast" id="hourly-forecast"></div>
            </div>

            <div class="forecast" style="display: none;">
                <h3>7-Day Forecast</h3>
                <div class="daily-forecast" id="daily-forecast"></div>
            </div>

            <div class="favorite">
                <button id="heart" type="button" title="Add to favourites">
                    <img src="images/heart.png" alt="Favourite">
                </button>
                <button id="show-favorites" type="button">
                    My favourites ♥
                </button>
            </div>
            
            <div class="forecast comparison-forecast">
                <h3 id="hourly-title">24-Hour Forecast Comparison</h3>
                <canvas id="comparison-chart"></canvas>
            </div>

            <div id="favorites-menu" class="favorites-menu"
                 style="display: none;"></div>

        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="script.js"></script>
    </body>
</html>
